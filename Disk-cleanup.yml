---
- name: Root-vg filesystem cleanup and expansion
  hosts: all
  become: true
  remote_user: ansibleclient
  gather_facts: false

  vars:
    usage_threshold: 80
    target_vg: root-vg
    extend_size: 5G
    extend_size_gb: 5

  tasks:

    # ---------------------------------------------------------
    # 1. Get all mounted filesystems belonging to root-vg
    # ---------------------------------------------------------
    - name: Get root-vg logical volumes and mount points
      ansible.builtin.shell: |
        lvs --noheadings --separator '|' \
          -o lv_name,vg_name,lv_path |
        awk -F'|' '$2 ~ /{{ target_vg }}/ {
          gsub(/^[ \t]+|[ \t]+$/, "", $1);
          gsub(/^[ \t]+|[ \t]+$/, "", $3);
          print $1 "|" $3
        }'
      register: rootvg_lvs
      changed_when: false

    - name: Display root-vg LVs
      ansible.builtin.debug:
        var: rootvg_lvs.stdout_lines

    # ---------------------------------------------------------
    # 2. Build list of mounted root-vg filesystems
    # ---------------------------------------------------------
    - name: Get mount points for root-vg LVs
      ansible.builtin.shell: |
        findmnt -rn -o SOURCE,TARGET,FSTYPE |
        awk '$1 ~ "^/dev/mapper/{{ target_vg | replace("-", "--") }}-" {
          print
        }'
      register: rootvg_mounts
      changed_when: false

    - name: Display root-vg filesystems
      ansible.builtin.debug:
        var: rootvg_mounts.stdout_lines

    # ---------------------------------------------------------
    # 3. Check usage of all root-vg filesystems
    # ---------------------------------------------------------
    - name: Check root-vg filesystem usage
      ansible.builtin.shell: |
        df -P "{{ item.split()[1] }}" |
        awk 'NR==2 {gsub("%","",$5); print $5}'
      loop: "{{ rootvg_mounts.stdout_lines }}"
      register: filesystem_usage
      changed_when: false

    - name: Display filesystem usage
      ansible.builtin.debug:
        msg: "{{ item.item }} => {{ item.stdout }}%"
      loop: "{{ filesystem_usage.results }}"

    # ---------------------------------------------------------
    # 4. Determine whether cleanup is required
    # ---------------------------------------------------------
    - name: Set cleanup required flag
      ansible.builtin.set_fact:
        cleanup_required: >-
          {{
            filesystem_usage.results
            | selectattr('stdout', 'defined')
            | map(attribute='stdout')
            | map('int')
            | select('ge', usage_threshold)
            | list
            | length > 0
          }}

    - name: Display cleanup status
      ansible.builtin.debug:
        msg: "Cleanup required: {{ cleanup_required }}"

    # ---------------------------------------------------------
    # 5. DNF cleanup
    # ---------------------------------------------------------
    - name: Clean DNF cache
      ansible.builtin.command:
        cmd: dnf clean all
      when: cleanup_required | bool

    # ---------------------------------------------------------
    # 6. Delete abc.gz files
    # ---------------------------------------------------------
    - name: Find abc.gz files
      ansible.builtin.find:
        paths:
          - /testlv
        patterns:
          - abc.gz
        recurse: true
        file_type: file
      register: abc_files
      when: cleanup_required | bool

    - name: Delete abc.gz files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ abc_files.files | default([]) }}"
      when:
        - cleanup_required | bool
        - abc_files.files | default([]) | length > 0

    # ---------------------------------------------------------
    # 7. Clean archived journals
    # ---------------------------------------------------------
    - name: Clean archived journal files
      ansible.builtin.command:
        cmd: journalctl --vacuum-time=7d
      when: cleanup_required | bool

    # ---------------------------------------------------------
    # 8. Recheck all root-vg filesystems
    # ---------------------------------------------------------
    - name: Recheck root-vg filesystem usage
      ansible.builtin.shell: |
        df -P "{{ item.split()[1] }}" |
        awk 'NR==2 {gsub("%","",$5); print $5}'
      loop: "{{ rootvg_mounts.stdout_lines }}"
      register: filesystem_usage_after_cleanup
      changed_when: false

    - name: Display usage after cleanup
      ansible.builtin.debug:
        msg: "{{ item.item }} => {{ item.stdout }}%"
      loop: "{{ filesystem_usage_after_cleanup.results }}"

    # ---------------------------------------------------------
    # 9. Find filesystems still >= 80%
    # ---------------------------------------------------------
    - name: Identify filesystems requiring LV expansion
      ansible.builtin.set_fact:
        filesystems_to_extend: >-
          {{
            filesystem_usage_after_cleanup.results
            | selectattr('stdout', 'defined')
            | selectattr('stdout', 'match', '^[0-9]+$')
            | selectattr('stdout', 'ge', usage_threshold | string)
            | map(attribute='item')
            | list
          }}

    - name: Display filesystems requiring expansion
      ansible.builtin.debug:
        var: filesystems_to_extend

    # ---------------------------------------------------------
    # 10. Check free space in root-vg
    #
    # IMPORTANT:
    # Use command instead of shell/awk so that AAP gets
    # the actual vgs output directly.
    # ---------------------------------------------------------
    - name: Check free space in root-vg
      ansible.builtin.command:
        cmd: >
          vgs --noheadings
          --units g
          --nosuffix
          -o vg_free
          {{ target_vg }}
      register: rootvg_free
      changed_when: false
      when: filesystems_to_extend | length > 0

    # ---------------------------------------------------------
    # 10a. Convert VG free space to numeric value
    # ---------------------------------------------------------
    - name: Set root-vg free space in GB
      ansible.builtin.set_fact:
        rootvg_free_gb: "{{ rootvg_free.stdout | trim | float }}"
      when: filesystems_to_extend | length > 0

    # ---------------------------------------------------------
    # 10b. Display free space
    # ---------------------------------------------------------
    - name: Display root-vg free space
      ansible.builtin.debug:
        msg:
          - "VG: {{ target_vg }}"
          - "Raw VG free: '{{ rootvg_free.stdout | trim }}'"
          - "VG free: {{ rootvg_free_gb }} GB"
          - "Required: {{ extend_size_gb }} GB"
      when: filesystems_to_extend | length > 0

    # ---------------------------------------------------------
    # 10c. Stop if VG does not have enough space
    # ---------------------------------------------------------
    - name: Check sufficient free space in root-vg
      ansible.builtin.fail:
        msg: >-
          {{ target_vg }} has only {{ rootvg_free_gb }} GB free.
          {{ extend_size_gb }} GB is required to extend the LV.
      when:
        - filesystems_to_extend | length > 0
        - rootvg_free_gb | float < extend_size_gb | float

    # ---------------------------------------------------------
    # 11. Extend affected LV by 5 GB
    # ---------------------------------------------------------
    - name: Extend affected logical volume
      ansible.builtin.command:
        cmd: >
          lvextend -r -L +{{ extend_size }}
          "{{ item.split()[0] }}"
      become: true
      loop: "{{ filesystems_to_extend }}"
      when:
        - filesystems_to_extend | length > 0
        - rootvg_free_gb | float >= extend_size_gb | float

    # ---------------------------------------------------------
    # 12. Verify filesystem usage after expansion
    # ---------------------------------------------------------
    - name: Check filesystem usage after expansion
      ansible.builtin.shell: |
        df -P "{{ item.split()[1] }}" |
        awk 'NR==2 {gsub("%","",$5); print $5}'
      loop: "{{ filesystems_to_extend }}"
      register: filesystem_usage_final
      changed_when: false
      when: filesystems_to_extend | length > 0

    - name: Display final filesystem usage
      ansible.builtin.debug:
        msg: "{{ item.item.split('|')[1] }} => {{ item.stdout }}%"
      loop: "{{ filesystem_usage_final.results }}"
      when: filesystems_to_extend | length > 0
