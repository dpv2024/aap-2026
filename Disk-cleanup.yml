---
- name: Root-vg filesystem cleanup and expansion
  hosts: all
  become: true
  gather_facts: false

  vars:
    usage_threshold: 80
    target_vg: root-vg
    extend_size: 5G
    extend_size_gb: 5

  tasks:

    # =========================================================
    # 1. Get mounted filesystems belonging to root-vg
    # =========================================================
    - name: Get root-vg mounted filesystems
      ansible.builtin.shell: |
        findmnt -rn -o SOURCE,TARGET,FSTYPE |
        while read source target fstype; do
          vg=$(lvs --noheadings -o vg_name "$source" 2>/dev/null | xargs)
          lv=$(lvs --noheadings -o lv_path "$source" 2>/dev/null | xargs)

          if [ "$vg" = "{{ target_vg }}" ]; then
            echo "$lv|$target|$fstype"
          fi
        done
      register: rootvg_mounts
      changed_when: false

    - name: Display root-vg filesystems
      ansible.builtin.debug:
        var: rootvg_mounts.stdout_lines


    # =========================================================
    # 2. Check filesystem usage
    # =========================================================
    - name: Check root-vg filesystem usage
      ansible.builtin.shell: |
        df -P "{{ item.split('|')[1] }}" |
        awk 'NR==2 {
          gsub("%","",$5);
          print $5
        }'
      loop: "{{ rootvg_mounts.stdout_lines }}"
      register: filesystem_usage
      changed_when: false

    - name: Display filesystem usage
      ansible.builtin.debug:
        msg: "{{ item.item }} => {{ item.stdout }}%"
      loop: "{{ filesystem_usage.results }}"


    # =========================================================
    # 3. Determine whether cleanup is required
    # =========================================================
    - name: Set cleanup required flag
      ansible.builtin.set_fact:
        cleanup_required: >-
          {{
            filesystem_usage.results
            | map(attribute='stdout')
            | map('int')
            | select('ge', usage_threshold)
            | list
            | length > 0
          }}

    - name: Display cleanup status
      ansible.builtin.debug:
        msg: "Cleanup required: {{ cleanup_required }}"


    # =========================================================
    # 4. DNF cleanup
    # =========================================================
    - name: Clean DNF cache
      ansible.builtin.command:
        cmd: dnf clean all
      when: cleanup_required | bool


    # =========================================================
    # 5. Find abc.gz
    # =========================================================
    - name: Find abc.gz files
      ansible.builtin.find:
        paths:
          - /testlv
        patterns:
          - abc.gz
        recurse: true
        file_type: file
      register: abc_files
      when: cleanup_required | bool


    # =========================================================
    # 6. Delete abc.gz
    # =========================================================
    - name: Delete abc.gz files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ abc_files.files | default([]) }}"
      when:
        - cleanup_required | bool
        - abc_files.files | default([]) | length > 0


    # =========================================================
    # 7. Journal cleanup
    # =========================================================
    - name: Clean archived journal files
      ansible.builtin.command:
        cmd: journalctl --vacuum-time=7d
      when: cleanup_required | bool


    # =========================================================
    # 8. Recheck filesystem usage
    # =========================================================
    - name: Recheck root-vg filesystem usage
      ansible.builtin.shell: |
        df -P "{{ item.split('|')[1] }}" |
        awk 'NR==2 {
          gsub("%","",$5);
          print $5
        }'
      loop: "{{ rootvg_mounts.stdout_lines }}"
      register: filesystem_usage_after_cleanup
      changed_when: false

    - name: Display usage after cleanup
      ansible.builtin.debug:
        msg: "{{ item.item }} => {{ item.stdout }}%"
      loop: "{{ filesystem_usage_after_cleanup.results }}"


    # =========================================================
    # 9. Build list of filesystems requiring expansion
    # =========================================================
    - name: Identify filesystems requiring LV expansion
      ansible.builtin.set_fact:
        filesystems_to_extend: >-
          {{
            filesystem_usage_after_cleanup.results
            | selectattr('stdout', 'defined')
            | selectattr('stdout', 'match', '^[0-9]+$')
            | selectattr('stdout', 'ge', usage_threshold | string)
            | list
          }}

    - name: Display filesystems requiring expansion
      ansible.builtin.debug:
        msg:
          - "Filesystem: {{ item.item.split('|')[1] }}"
          - "LV: {{ item.item.split('|')[0] }}"
          - "Filesystem type: {{ item.item.split('|')[2] }}"
          - "Usage: {{ item.stdout }}%"
      loop: "{{ filesystems_to_extend }}"


    # =========================================================
    # 10. Check root-vg free space
    # =========================================================
    - name: Check free space in root-vg
      ansible.builtin.shell: |
        vgs --noheadings --units g --nosuffix \
          -o vg_free "{{ target_vg }}" |
          awk '{print $1}'
      register: rootvg_free
      changed_when: false
      when: filesystems_to_extend | length > 0


    - name: Display root-vg free space
      ansible.builtin.debug:
        msg:
          - "VG: {{ target_vg }}"
          - "Available free space: {{ rootvg_free.stdout | trim }} GB"
          - "Required for one LV: {{ extend_size_gb }} GB"
      when: filesystems_to_extend | length > 0


    # =========================================================
    # 11. Fail clearly if insufficient VG space
    # =========================================================
    - name: Stop if root-vg does not have enough space
      ansible.builtin.fail:
        msg: >-
          {{ target_vg }} has only {{ rootvg_free.stdout | trim }} GB free,
          but {{ extend_size_gb }} GB is required to extend the affected LV.
      when:
        - filesystems_to_extend | length > 0
        - rootvg_free.stdout | trim | float < extend_size_gb


    # =========================================================
    # 12. Extend affected LV
    # =========================================================
    - name: Extend affected logical volume by 5 GB
      ansible.builtin.command:
        cmd: >
          lvextend -r -L +{{ extend_size }}
          "{{ item.item.split('|')[0] }}"
      loop: "{{ filesystems_to_extend }}"
      when:
        - filesystems_to_extend | length > 0
        - rootvg_free.stdout | trim | float >= extend_size_gb


    # =========================================================
    # 13. Verify filesystem after expansion
    # =========================================================
    - name: Verify filesystem usage after expansion
      ansible.builtin.shell: |
        df -P "{{ item.item.split('|')[1] }}" |
        awk 'NR==2 {
          gsub("%","",$5);
          print $5
        }'
      loop: "{{ filesystems_to_extend }}"
      register: filesystem_usage_final
      changed_when: false

    - name: Display final filesystem usage
      ansible.builtin.debug:
        msg: >-
          {{ item.item.item.split('|')[1] }}
          => {{ item.stdout }}%
      loop: "{{ filesystem_usage_final.results }}"
