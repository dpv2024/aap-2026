---
- name: Root-vg filesystem cleanup and expansion
  hosts: all
  become: true
  gather_facts: false

  vars:
    usage_threshold: 80
    target_vg: root-vg
    extend_size: 5G
    extend_size_gb: 5

  tasks:

    # =========================================================
    # 1. Get all mounted filesystems from root-vg
    # =========================================================
    - name: Get root-vg mounted filesystems
      ansible.builtin.shell: |
        lvs --noheadings --separator '|' \
          -o lv_path,vg_name |
        awk -F'|' '
        {
          gsub(/^[ \t]+|[ \t]+$/, "", $1);
          gsub(/^[ \t]+|[ \t]+$/, "", $2);

          if ($2 == "{{ target_vg }}") {
            print $1
          }
        }'
      register: rootvg_lvs
      changed_when: false

    - name: Display root-vg LVs
      ansible.builtin.debug:
        var: rootvg_lvs.stdout_lines


    # =========================================================
    # 2. Find mount point for each LV
    # =========================================================
    - name: Build root-vg filesystem list
      ansible.builtin.shell: |
        findmnt -rn -o SOURCE,TARGET,FSTYPE |
        while read -r source target fstype; do

          vg=$(lvs --noheadings -o vg_name "$source" 2>/dev/null | xargs)

          if [ "$vg" = "{{ target_vg }}" ]; then
            echo "$source|$target|$fstype"
          fi

        done
      register: rootvg_filesystems
      changed_when: false

    - name: Display root-vg filesystems
      ansible.builtin.debug:
        var: rootvg_filesystems.stdout_lines


    # =========================================================
    # 3. Check filesystem usage
    # =========================================================
    - name: Check filesystem usage
      ansible.builtin.shell: |
        df -P "{{ item.split('|')[1] }}" |
        awk 'NR==2 {
          gsub("%","",$5);
          print $5
        }'
      loop: "{{ rootvg_filesystems.stdout_lines }}"
      register: filesystem_usage
      changed_when: false

    - name: Display filesystem usage
      ansible.builtin.debug:
        msg:
          - "Filesystem: {{ item.item.split('|')[1] }}"
          - "LV: {{ item.item.split('|')[0] }}"
          - "FSType: {{ item.item.split('|')[2] }}"
          - "Usage: {{ item.stdout }}%"
      loop: "{{ filesystem_usage.results }}"


    # =========================================================
    # 4. Determine cleanup required
    # =========================================================
    - name: Initialize cleanup flag
      ansible.builtin.set_fact:
        cleanup_required: false

    - name: Determine whether cleanup is required
      ansible.builtin.set_fact:
        cleanup_required: true
      loop: "{{ filesystem_usage.results }}"
      when:
        - item.stdout is defined
        - item.stdout | trim | int >= usage_threshold

    - name: Display cleanup status
      ansible.builtin.debug:
        msg: "Cleanup required: {{ cleanup_required }}"


    # =========================================================
    # 5. Clean DNF cache
    # =========================================================
    - name: Clean DNF cache
      ansible.builtin.command:
        cmd: dnf clean all
      when: cleanup_required | bool


    # =========================================================
    # 6. Find abc.gz
    # =========================================================
    - name: Find abc.gz files
      ansible.builtin.find:
        paths:
          - /testlv
        patterns:
          - abc.gz
        recurse: true
        file_type: file
      register: abc_files
      when: cleanup_required | bool


    # =========================================================
    # 7. Delete abc.gz
    # =========================================================
    - name: Delete abc.gz files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ abc_files.files | default([]) }}"
      when:
        - cleanup_required | bool
        - abc_files.files | default([]) | length > 0


    # =========================================================
    # 8. Journal cleanup
    # =========================================================
    - name: Clean archived journals
      ansible.builtin.command:
        cmd: journalctl --vacuum-time=7d
      when: cleanup_required | bool


    # =========================================================
    # 9. Recheck filesystem usage
    # =========================================================
    - name: Recheck filesystem usage
      ansible.builtin.shell: |
        df -P "{{ item.split('|')[1] }}" |
        awk 'NR==2 {
          gsub("%","",$5);
          print $5
        }'
      loop: "{{ rootvg_filesystems.stdout_lines }}"
      register: filesystem_usage_after_cleanup
      changed_when: false

    - name: Display usage after cleanup
      ansible.builtin.debug:
        msg:
          - "Filesystem: {{ item.item.split('|')[1] }}"
          - "Usage after cleanup: {{ item.stdout }}%"
      loop: "{{ filesystem_usage_after_cleanup.results }}"


    # =========================================================
    # 10. Identify filesystems still >= 80%
    # =========================================================
    - name: Initialize expansion list
      ansible.builtin.set_fact:
        filesystems_to_extend: []


    - name: Identify filesystems requiring expansion
      ansible.builtin.set_fact:
        filesystems_to_extend: >-
          {{
            filesystems_to_extend + [{
              'lv': item.item.split('|')[0],
              'mount': item.item.split('|')[1],
              'fstype': item.item.split('|')[2],
              'usage': item.stdout | trim | int
            }]
          }}
      loop: "{{ filesystem_usage_after_cleanup.results }}"
      when:
        - item.stdout is defined
        - item.stdout | trim | int >= usage_threshold


    # =========================================================
    # 11. Display expansion candidates
    # =========================================================
    - name: Display filesystems requiring expansion
      ansible.builtin.debug:
        msg:
          - "Filesystem: {{ item.mount }}"
          - "LV: {{ item.lv }}"
          - "FSType: {{ item.fstype }}"
          - "Usage: {{ item.usage }}%"
      loop: "{{ filesystems_to_extend }}"


    # =========================================================
    # 12. Display expansion status
    # =========================================================
    - name: Display expansion status
      ansible.builtin.debug:
        msg: >-
          {{ filesystems_to_extend | length }}
          filesystem(s) require expansion.


    # =========================================================
    # 13. Calculate required VG space
    # =========================================================
    - name: Calculate required VG space
      ansible.builtin.set_fact:
        required_vg_space: >-
          {{ (filesystems_to_extend | length) * extend_size_gb }}
      when: filesystems_to_extend | length > 0


    # =========================================================
    # 14. Check VG free space
    # =========================================================
    - name: Check root-vg free space
      ansible.builtin.shell: |
        vgs --noheadings --units g --nosuffix \
          -o vg_free "{{ target_vg }}" |
          awk '{print $1}'
      register: rootvg_free
      changed_when: false
      when: filesystems_to_extend | length > 0


    # =========================================================
    # 15. Display VG information
    # =========================================================
    - name: Display VG information
      ansible.builtin.debug:
        msg:
          - "VG: {{ target_vg }}"
          - "Free space: {{ rootvg_free.stdout | trim }} GB"
          - "Required space: {{ required_vg_space }} GB"
      when: filesystems_to_extend | length > 0


    # =========================================================
    # 16. Fail if insufficient VG space
    # =========================================================
    - name: Stop if insufficient VG space
      ansible.builtin.fail:
        msg: >-
          {{ target_vg }} has
          {{ rootvg_free.stdout | trim }} GB free,
          but {{ required_vg_space }} GB is required.
      when:
        - filesystems_to_extend | length > 0
        - rootvg_free.stdout | trim | float < required_vg_space | float


    # =========================================================
    # 17. Extend affected LVs
    # =========================================================
    - name: Extend affected logical volumes
      ansible.builtin.command:
        cmd: >
          lvextend -r -L +{{ extend_size }}
          "{{ item.lv }}"
      loop: "{{ filesystems_to_extend }}"
      when:
        - filesystems_to_extend | length > 0
        - rootvg_free.stdout | trim | float >= required_vg_space | float


    # =========================================================
    # 18. Verify final usage
    # =========================================================
    - name: Check final filesystem usage
      ansible.builtin.shell: |
        df -P "{{ item.mount }}" |
        awk 'NR==2 {
          gsub("%","",$5);
          print $5
        }'
      loop: "{{ filesystems_to_extend }}"
      register: filesystem_usage_final
      changed_when: false
      when: filesystems_to_extend | length > 0


    # =========================================================
    # 19. Display final usage
    # =========================================================
    - name: Display final filesystem usage
      ansible.builtin.debug:
        msg:
          - "Filesystem: {{ item.item.mount }}"
          - "Final usage: {{ item.stdout }}%"
      loop: "{{ filesystem_usage_final.results }}"
      when: filesystems_to_extend | length > 0
