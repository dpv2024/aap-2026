---
- name: Root-vg filesystem cleanup and expansion
  hosts: all
  become: true
  gather_facts: false

  vars:
    usage_threshold: 80
    target_vg: root-vg
    extend_size: 5G
    extend_size_gb: 5

  tasks:

    # =========================================================
    # 1. Get root-vg mounted filesystems
    # =========================================================
    - name: Get root-vg mounted filesystems
      ansible.builtin.shell: |
        findmnt -rn -o SOURCE,TARGET,FSTYPE |
        while read -r source target fstype; do
          vg=$(lvs --noheadings -o vg_name "$source" 2>/dev/null | xargs)
          lv=$(lvs --noheadings -o lv_path "$source" 2>/dev/null | xargs)

          if [ "$vg" = "{{ target_vg }}" ]; then
            echo "$lv|$target|$fstype"
          fi
        done
      register: rootvg_mounts
      changed_when: false

    - name: Display root-vg filesystems
      ansible.builtin.debug:
        var: rootvg_mounts.stdout_lines


    # =========================================================
    # 2. Initialize filesystem information
    # =========================================================
    - name: Initialize filesystem information
      ansible.builtin.set_fact:
        filesystem_info: []


    # =========================================================
    # 3. Check usage and create structured list
    # =========================================================
    - name: Check filesystem usage
      ansible.builtin.shell: |
        df -P "{{ item.split('|')[1] }}" |
        awk 'NR==2 {
          gsub("%","",$5);
          print $5
        }'
      loop: "{{ rootvg_mounts.stdout_lines }}"
      register: filesystem_usage
      changed_when: false


    - name: Build filesystem information
      ansible.builtin.set_fact:
        filesystem_info: >-
          {{
            filesystem_info + [{
              'lv': item.item.split('|')[0],
              'mount': item.item.split('|')[1],
              'fstype': item.item.split('|')[2],
              'usage': item.stdout | trim | int
            }]
          }}
      loop: "{{ filesystem_usage.results }}"


    - name: Display filesystem information
      ansible.builtin.debug:
        var: filesystem_info


    # =========================================================
    # 4. Determine whether cleanup is required
    # =========================================================
    - name: Initialize cleanup required
      ansible.builtin.set_fact:
        cleanup_required: false


    - name: Determine whether cleanup is required
      ansible.builtin.set_fact:
        cleanup_required: true
      loop: "{{ filesystem_info }}"
      when:
        - item.usage | int >= usage_threshold


    - name: Display cleanup status
      ansible.builtin.debug:
        msg: "Cleanup required: {{ cleanup_required }}"


    # =========================================================
    # 5. Clean DNF cache
    # =========================================================
    - name: Clean DNF cache
      ansible.builtin.command:
        cmd: dnf clean all
      when: cleanup_required | bool


    # =========================================================
    # 6. Find abc.gz
    # =========================================================
    - name: Find abc.gz files
      ansible.builtin.find:
        paths:
          - /testlv
        patterns:
          - abc.gz
        recurse: true
        file_type: file
      register: abc_files
      when: cleanup_required | bool


    # =========================================================
    # 7. Display abc.gz count
    # =========================================================
    - name: Display abc.gz count
      ansible.builtin.debug:
        msg: "Found {{ abc_files.files | default([]) | length }} abc.gz file(s)"
      when: cleanup_required | bool


    # =========================================================
    # 8. Delete abc.gz files
    # =========================================================
    - name: Delete abc.gz files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ abc_files.files | default([]) }}"
      when:
        - cleanup_required | bool
        - abc_files.files | default([]) | length > 0


    # =========================================================
    # 9. Clean journal
    # =========================================================
    - name: Clean archived journals
      ansible.builtin.command:
        cmd: journalctl --vacuum-time=7d
      when: cleanup_required | bool


    # =========================================================
    # 10. Recheck filesystem usage
    # =========================================================
    - name: Recheck filesystem usage
      ansible.builtin.shell: |
        df -P "{{ item.mount }}" |
        awk 'NR==2 {
          gsub("%","",$5);
          print $5
        }'
      loop: "{{ filesystem_info }}"
      register: filesystem_usage_after_cleanup
      changed_when: false


    # =========================================================
    # 11. Build updated filesystem information
    # =========================================================
    - name: Initialize updated filesystem information
      ansible.builtin.set_fact:
        filesystem_info_after_cleanup: []


    - name: Build updated filesystem information
      ansible.builtin.set_fact:
        filesystem_info_after_cleanup: >-
          {{
            filesystem_info_after_cleanup + [{
              'lv': item.item.lv,
              'mount': item.item.mount,
              'fstype': item.item.fstype,
              'usage': item.stdout | trim | int
            }]
          }}
      loop: "{{ filesystem_usage_after_cleanup.results }}"


    - name: Display usage after cleanup
      ansible.builtin.debug:
        var: filesystem_info_after_cleanup


    # =========================================================
    # 12. Identify filesystems still >= 80%
    # =========================================================
    - name: Initialize filesystems requiring expansion
      ansible.builtin.set_fact:
        filesystems_to_extend: []


    - name: Identify filesystems requiring expansion
      ansible.builtin.set_fact:
        filesystems_to_extend: >-
          {{
            filesystems_to_extend + [item]
          }}
      loop: "{{ filesystem_info_after_cleanup }}"
      when:
        - item.usage | int >= usage_threshold


    - name: Display filesystems requiring expansion
      ansible.builtin.debug:
        msg:
          - "Filesystem: {{ item.mount }}"
          - "LV: {{ item.lv }}"
          - "Filesystem type: {{ item.fstype }}"
          - "Usage: {{ item.usage }}%"
      loop: "{{ filesystems_to_extend }}"


    # =========================================================
    # 13. Check if expansion is required
    # =========================================================
    - name: Display expansion status
      ansible.builtin.debug:
        msg: >-
          {{ filesystems_to_extend | length }}
          filesystem(s) require expansion.


    # =========================================================
    # 14. Calculate required VG space
    # =========================================================
    - name: Calculate required VG space
      ansible.builtin.set_fact:
        required_vg_space: >-
          {{ (filesystems_to_extend | length) * extend_size_gb }}
      when: filesystems_to_extend | length > 0


    # =========================================================
    # 15. Check root-vg free space
    # =========================================================
    - name: Check root-vg free space
      ansible.builtin.shell: |
        vgs --noheadings --units g --nosuffix \
          -o vg_free "{{ target_vg }}" |
          awk '{print $1}'
      register: rootvg_free
      changed_when: false
      when: filesystems_to_extend | length > 0


    # =========================================================
    # 16. Display VG information
    # =========================================================
    - name: Display VG information
      ansible.builtin.debug:
        msg:
          - "VG: {{ target_vg }}"
          - "Free space: {{ rootvg_free.stdout | trim }} GB"
          - "Required space: {{ required_vg_space }} GB"
      when: filesystems_to_extend | length > 0


    # =========================================================
    # 17. Stop if insufficient VG space
    # =========================================================
    - name: Stop if insufficient VG space
      ansible.builtin.fail:
        msg: >-
          Not enough space in {{ target_vg }}.
          Available: {{ rootvg_free.stdout | trim }} GB.
          Required: {{ required_vg_space }} GB.
      when:
        - filesystems_to_extend | length > 0
        - rootvg_free.stdout | trim | float < required_vg_space | float


    # =========================================================
    # 18. Extend affected LVs
    # =========================================================
    - name: Extend affected logical volume by 5 GB
      ansible.builtin.command:
        cmd: >
          lvextend -r -L +{{ extend_size }}
          "{{ item.lv }}"
      loop: "{{ filesystems_to_extend }}"
      when:
        - filesystems_to_extend | length > 0
        - rootvg_free.stdout | trim | float >= required_vg_space | float


    # =========================================================
    # 19. Verify final filesystem usage
    # =========================================================
    - name: Check final filesystem usage
      ansible.builtin.shell: |
        df -P "{{ item.mount }}" |
        awk 'NR==2 {
          gsub("%","",$5);
          print $5
        }'
      loop: "{{ filesystems_to_extend }}"
      register: filesystem_usage_final
      changed_when: false
      when: filesystems_to_extend | length > 0


    # =========================================================
    # 20. Display final usage
    # =========================================================
    - name: Display final filesystem usage
      ansible.builtin.debug:
        msg:
          - "Filesystem: {{ item.item.mount }}"
          - "Final usage: {{ item.stdout }}%"
      loop: "{{ filesystem_usage_final.results }}"
      when: filesystems_to_extend | length > 0
