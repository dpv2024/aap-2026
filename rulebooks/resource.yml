---
- name: Infrastructure monitoring webhook
  hosts: all

  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5001

  rules:

    # Disk space event
    - name: Disk space alert
      condition: event.payload is defined 
      action:
        run_job_template:
          name: Disk Space Check
          organization: Default

