---
- name: Grant testuser temporary sudo access
  hosts: 192.168.1.11
  become: true
  become_method: sudo
  remote_user: ansibleclient
  gather_facts: false

  tasks:
    - name: Grant testuser sudo access
      ansible.builtin.shell: |
        sudo echo 'testuser ALL=(ALL:ALL) ALL' > /etc/sudoers.d/temp-root-testuser
        sudo chown root:root /etc/sudoers.d/temp-root-testuser
        sudo chmod 0440 /etc/sudoers.d/temp-root-testuser
        sudo /usr/sbin/visudo -cf /etc/sudoers.d/temp-root-testuser
      args:
        executable: /bin/bash

    - name: Keep access for seven days
      ansible.builtin.pause:
        seconds: 604800

    - name: Revoke testuser sudo access
      ansible.builtin.shell: |
        rm -f /etc/sudoers.d/temp-root-testuser
      args:
        executable: /bin/bash
