
---
- name: Grant temporary sudo access and revoke after 1 day
  hosts: 192.168.1.11
  become: true
  become_method: sudo
  remote_user: ansibleclient
  gather_facts: false

  tasks:
    - name: Grant testuser sudo access
      ansible.builtin.copy:
      become: true
      become_user: root
        dest: /etc/sudoers.d/temp-root-testuser
        content: "testuser ALL=(ALL:ALL) ALL\n"
        owner: root
        group: root
        mode: '0440'
        validate: '/usr/sbin/visudo -cf %s'

    - name: Confirm sudoers configuration
      ansible.builtin.command:
        cmd: /usr/sbin/visudo -c
      changed_when: false

    - name: Wait 24 hours before revoking access
      ansible.builtin.pause:
        seconds: 86400
        prompt: "Temporary sudo access is active. Waiting 24 hours before revocation."

    - name: Revoke testuser sudo access
      ansible.builtin.file:
        path: /etc/sudoers.d/temp-root-testuser
        state: absent

    - name: Validate sudoers configuration after revocation
      ansible.builtin.command:
        cmd: /usr/sbin/visudo -c
      changed_when: false

    - name: Confirm revocation
      ansible.builtin.debug:
        msg: "Temporary sudo access has been revoked after 24 hours."
